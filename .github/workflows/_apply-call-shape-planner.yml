name: Apply call-shape planner refactor

on:
  push:
    branches: [gate-b-call-shape-planner]
    paths: [.github/workflows/_apply-call-shape-planner.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-call-shape-planner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refactor client call-shape planning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/client_generator.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
          '''#[derive(Clone, Copy, PartialEq, Eq)]
          enum ClientResponseRepresentation {
              Default,
              BinaryStream,
          }

          #[derive(Clone)]
          struct ClientSuccessSelection<'a> {
              statuses: Vec<&'a str>,
              body: ClientSuccessBody<'a>,
              accept: Option<&'a str>,
          }
          ''',
          '''#[derive(Clone, Copy, PartialEq, Eq)]
          pub(crate) enum ClientResponseTransport {
              Buffered,
              EventStream,
              BinaryStream,
          }

          #[derive(Clone, Copy, PartialEq, Eq)]
          pub(crate) enum ClientRequestVariant {
              Default,
              MultipartFilenames,
          }

          #[derive(Clone)]
          pub(crate) struct ClientSuccessSelection<'a> {
              pub(crate) statuses: Vec<&'a str>,
              pub(crate) body: ClientSuccessBody<'a>,
              pub(crate) accept: Option<&'a str>,
          }
          ''')

          replace_once(
          '''#[derive(Clone)]
          struct ClientOperationMethodPlan<'a> {
              operation: &'a OperationInfo,
              method_name: syn::Ident,
              multipart_filename_method_name: Option<syn::Ident>,
              binary_stream_method_name: Option<syn::Ident>,
          }
          ''',
          '''#[derive(Clone)]
          pub(crate) struct ClientSourceOperationIdentity {
              pub(crate) operation_id: String,
              pub(crate) method: String,
              pub(crate) path: String,
          }

          #[derive(Clone)]
          pub(crate) struct ClientCallShapePlan<'a> {
              pub(crate) method_name: syn::Ident,
              pub(crate) request_variant: ClientRequestVariant,
              pub(crate) success: ClientSuccessSelection<'a>,
              pub(crate) response_transport: ClientResponseTransport,
          }

          #[derive(Clone)]
          pub(crate) struct ClientOperationMethodPlan<'a> {
              pub(crate) operation: &'a OperationInfo,
              pub(crate) source_operation: ClientSourceOperationIdentity,
              pub(crate) call_shapes: Vec<ClientCallShapePlan<'a>>,
          }
          ''')

          replace_once(
          '''        let has_streaming_response = operations.iter().any(|operation| {
              matches!(
                  self.get_success_response(analysis, operation).body,
                  ClientSuccessBody::EventStream | ClientSuccessBody::Binary
              )
          });
          ''',
          '''        let plans = self.plan_client_operation_methods(analysis, operations);
              let has_streaming_response = plans.iter().any(|plan| {
                  plan.call_shapes.iter().any(|shape| {
                      !matches!(shape.response_transport, ClientResponseTransport::Buffered)
                  })
              });
          ''')

          pattern = re.compile(r'''    fn plan_client_operation_methods<'a>\(.*?\n    fn generate_operation_builders\(''', re.S)
          replacement = '''    pub(crate) fn plan_client_operation_methods<'a>(
              &self,
              analysis: &'a SchemaAnalysis,
              operations: &[&'a OperationInfo],
          ) -> Vec<ClientOperationMethodPlan<'a>> {
              let mut used_method_names: std::collections::HashSet<String> = operations
                  .iter()
                  .map(|operation| self.get_method_name(operation).to_string())
                  .collect();

              operations
                  .iter()
                  .map(|operation| {
                      let operation = *operation;
                      let method_name = self.get_method_name(operation);
                      let success = self.get_success_response(analysis, operation);
                      let response_transport = if matches!(success.body, ClientSuccessBody::EventStream) {
                          ClientResponseTransport::EventStream
                      } else {
                          ClientResponseTransport::Buffered
                      };
                      let mut call_shapes = vec![ClientCallShapePlan {
                          method_name: method_name.clone(),
                          request_variant: ClientRequestVariant::Default,
                          success: success.clone(),
                          response_transport,
                      }];

                      if matches!(
                          operation.request_body.as_ref(),
                          Some(crate::analysis::RequestBodyContent::Multipart { .. })
                      ) {
                          let preferred = format!("{method_name}_with_multipart_filenames");
                          let allocated = Self::allocate_name(&preferred, &mut used_method_names);
                          call_shapes.push(ClientCallShapePlan {
                              method_name: Self::to_field_ident(&allocated),
                              request_variant: ClientRequestVariant::MultipartFilenames,
                              success: success.clone(),
                              response_transport,
                          });
                      }

                      if matches!(success.body, ClientSuccessBody::Binary) {
                          let preferred = format!("{method_name}_stream");
                          let allocated = Self::allocate_name(&preferred, &mut used_method_names);
                          call_shapes.push(ClientCallShapePlan {
                              method_name: Self::to_field_ident(&allocated),
                              request_variant: ClientRequestVariant::Default,
                              success,
                              response_transport: ClientResponseTransport::BinaryStream,
                          });
                      }

                      let source_operation_id = analysis
                          .operation_id_aliases
                          .iter()
                          .find_map(|(source, emitted)| {
                              emitted
                                  .iter()
                                  .any(|candidate| candidate == &operation.operation_id)
                                  .then_some(source.clone())
                          })
                          .unwrap_or_else(|| operation.operation_id.clone());

                      ClientOperationMethodPlan {
                          operation,
                          source_operation: ClientSourceOperationIdentity {
                              operation_id: source_operation_id,
                              method: operation.method.clone(),
                              path: operation.path.clone(),
                          },
                          call_shapes,
                      }
                  })
                  .collect()
          }

          fn generate_operation_builders('''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"planner block replacement count: {count}")

          pattern = re.compile(r'''    /// Generate a single operation method\..*?\n    /// T3: emit the auth-token application''', re.S)
          replacement = '''    /// Generate every planned call shape for a single source operation.
              fn generate_single_operation_method(
                  &self,
                  analysis: &SchemaAnalysis,
                  plan: &ClientOperationMethodPlan<'_>,
              ) -> TokenStream {
                  debug_assert!(!plan.source_operation.operation_id.is_empty());
                  debug_assert_eq!(plan.source_operation.method, plan.operation.method);
                  debug_assert_eq!(plan.source_operation.path, plan.operation.path);
                  let methods = plan.call_shapes.iter().map(|shape| {
                      self.generate_single_operation_method_variant(analysis, plan.operation, shape)
                  });
                  quote! { #(#methods)* }
              }

              fn generate_single_operation_method_variant(
                  &self,
                  analysis: &SchemaAnalysis,
                  op: &OperationInfo,
                  shape: &ClientCallShapePlan<'_>,
              ) -> TokenStream {
                  let method_name = shape.method_name.clone();
                  let with_multipart_filenames = matches!(
                      shape.request_variant,
                      ClientRequestVariant::MultipartFilenames
                  );
                  let http_method_call = self.http_method_call(op);
                  let path = &op.path;
                  let request_param = self.generate_request_param(op);
                  let request_params = if with_multipart_filenames {
                      if request_param.is_empty() {
                          quote! { multipart_filenames: &[(&str, &str)] }
                      } else {
                          quote! { #request_param, multipart_filenames: &[(&str, &str)] }
                      }
                  } else {
                      request_param
                  };
                  let request_body = self.generate_request_body(op, analysis, with_multipart_filenames);
                  let query_params = self.generate_query_params(op);
                  let header_params = self.generate_header_params(op);
                  let cookie_params = self.generate_cookie_params(op);
                  let auth_application = self.generate_auth_application();
                  let response_type = self.get_response_type(&shape.success, shape.response_transport);
                  let op_error_type = self.op_error_type_token(op);
                  let accept = shape.success.accept;
                  let error_handling = self.generate_error_handling(
                      op,
                      shape.success.clone(),
                      shape.response_transport,
                  );
                  let (custom_headers, accept_header) = if let Some(media_type) = accept {
                      (
                          quote! {
                              for (name, value) in &self.custom_headers {
                                  if !name.eq_ignore_ascii_case("accept") {
                                      req = req.header(name, value);
                                  }
                              }
                          },
                          quote! {
                              req = req.header(reqwest::header::ACCEPT, #media_type);
                          },
                      )
                  } else {
                      (
                          quote! {
                              for (name, value) in &self.custom_headers {
                                  req = req.header(name, value);
                              }
                          },
                          TokenStream::new(),
                      )
                  };
                  let url_construction = self.generate_url_construction(path, op);
                  let doc_comment = self.generate_operation_doc_comment(op);
                  let filename_doc = with_multipart_filenames.then(|| {
                      quote! {
                          /// Override multipart filenames for binary fields by OpenAPI wire name.
                          /// Unspecified binary fields retain the base method's no-filename behavior.
                      }
                  });
                  let representation_doc = matches!(
                      shape.response_transport,
                      ClientResponseTransport::BinaryStream
                  )
                  .then(|| {
                      quote! {
                          /// Stream the successful binary response body without buffering it.
                      }
                  });

                  quote! {
                      #doc_comment
                      #filename_doc
                      #representation_doc
                      pub async fn #method_name(
                          &self,
                          #request_params
                      ) -> Result<#response_type, ApiOpError<#op_error_type>> {
                          #url_construction

                          let mut req = #http_method_call;
                          #request_body

                          #query_params
                          #header_params
                          #cookie_params
                          #auth_application
                          #custom_headers
                          #accept_header

                          let response = req.send().await?;
                          #error_handling
                      }
                  }
              }
              /// T3: emit the auth-token application'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"renderer block replacement count: {count}")

          pattern = re.compile(r'''    /// Get response type\n    fn get_response_type\(.*?\n    fn success_status_guard''', re.S)
          replacement = '''    /// Get the Rust return type from the planned success representation.
              fn get_response_type(
                  &self,
                  success: &ClientSuccessSelection<'_>,
                  response_transport: ClientResponseTransport,
              ) -> TokenStream {
                  if !matches!(response_transport, ClientResponseTransport::Buffered) {
                      return quote! { HttpResponseByteStream };
                  }
                  match success.body {
                      ClientSuccessBody::Json(response_type) => {
                          let rust_type_name = self.to_rust_type_name(response_type);
                          let response_ident =
                              syn::Ident::new(&rust_type_name, proc_macro2::Span::call_site());
                          quote! { #response_ident }
                      }
                      ClientSuccessBody::Text => quote! { String },
                      ClientSuccessBody::Binary => quote! { bytes::Bytes },
                      ClientSuccessBody::EventStream => {
                          debug_assert!(false, "event streams must use the live-stream transport");
                          quote! { HttpResponseByteStream }
                      }
                      ClientSuccessBody::Empty => quote! { () },
                  }
              }

              fn success_status_guard'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"response type replacement count: {count}")

          replace_once(
          '''        response_representation: ClientResponseRepresentation,
          ''',
          '''        response_transport: ClientResponseTransport,
          ''')

          replace_once(
          '''        let streams_success = matches!(success_body, ClientSuccessBody::EventStream)
              || matches!(
                  response_representation,
                  ClientResponseRepresentation::BinaryStream
              );
          debug_assert!(
              !matches!(
                  response_representation,
                  ClientResponseRepresentation::BinaryStream
              ) || matches!(success_body, ClientSuccessBody::Binary)
          );
          ''',
          '''        let streams_success = !matches!(response_transport, ClientResponseTransport::Buffered);
              debug_assert!(
                  !matches!(response_transport, ClientResponseTransport::EventStream)
                      || matches!(success_body, ClientSuccessBody::EventStream)
              );
              debug_assert!(
                  !matches!(response_transport, ClientResponseTransport::BinaryStream)
                      || matches!(success_body, ClientSuccessBody::Binary)
              );
          ''')

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --test client_binary_stream_capabilities_test --test client_sse_capabilities_test --test client_multipart_capabilities_test
          cargo clippy --all-features -- -D warnings
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client_generator.rs
          git diff --cached --quiet && exit 0
          git commit -m "refactor: plan client response call shapes"
          git push origin HEAD:gate-b-call-shape-planner
