name: Cleanup request discriminator scratch
on:
  push:
    branches: [gate-b-request-discriminators]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove scratch artifacts and one-shot workflow
        run: |
          rm -rf tmp/request-discriminator-compile tmp/request-discriminator-target
          rm -f .github/workflows/cleanup-request-discriminator-scratch.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove discriminator scratch artifacts"
          git push origin HEAD:gate-b-request-discriminators
