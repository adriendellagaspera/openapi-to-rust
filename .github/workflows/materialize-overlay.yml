name: Validate Overlay implementation

on:
  push:
    branches: [feat/openapi-overlay-1-1]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openapi-overlay-1-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply conformance fixes
        run: python scripts/fix-overlay-validation.py
      - name: Validate and capture output
        id: validate
        shell: bash
        run: |
          cargo fmt --all
          set +e
          cargo check --all-targets --all-features > overlay-validation.log 2>&1
          check_status=$?
          cargo test --lib overlay >> overlay-validation.log 2>&1
          test_status=$?
          cargo test --test cli_workflow_test config_overlays_are_config_relative_deterministic_and_checked >> overlay-validation.log 2>&1
          cli_status=$?
          set -e
          printf '\ncheck_status=%s\ntest_status=%s\ncli_status=%s\n' "$check_status" "$test_status" "$cli_status" >> overlay-validation.log
          echo "check_status=$check_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo "cli_status=$cli_status" >> "$GITHUB_OUTPUT"
      - name: Commit fixed implementation and validation log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/overlay.rs tests/config_test.rs overlay-validation.log
          git commit -m "fix: align Overlay actions with 1.1 semantics"
          git push
      - name: Propagate validation result
        if: steps.validate.outputs.check_status != '0' || steps.validate.outputs.test_status != '0' || steps.validate.outputs.cli_status != '0'
        run: exit 1
