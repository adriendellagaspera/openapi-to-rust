name: Materialize Overlay implementation

on:
  push:
    branches: [feat/openapi-overlay-1-1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openapi-overlay-1-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused source edits
        run: python scripts/materialize-overlay.py
      - name: Format and validate materialized code
        id: validate
        shell: bash
        run: |
          cargo fmt --all
          set +e
          cargo check --all-targets --all-features
          check_status=$?
          cargo test --lib overlay
          test_status=$?
          set -e
          echo "check_status=$check_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
      - name: Commit materialized implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock src/config.rs src/lib.rs src/bin/openapi-to-rust.rs tests/cli_workflow_test.rs
          git commit -m "feat: support OpenAPI Overlay 1.1"
          git push
      - name: Propagate validation result
        if: steps.validate.outputs.check_status != '0' || steps.validate.outputs.test_status != '0'
        run: exit 1
