name: Materialize cross-status call shapes

on:
  push:
    branches: [gate-b-call-shape-planner]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply focused planner correction
        run: python .github/materializers/cross_status_call_shapes.py
      - name: Remove materializer
        run: rm .github/materializers/cross_status_call_shapes.py .github/workflows/materialize-cross-status-call-shapes.yml
      - run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test client_response_call_shapes_test --test client_binary_stream_capabilities_test --test operation_builder_test
      - name: Strict clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Refresh generated corpus tripwire
        run: scripts/corpus-manifest.sh
      - name: Commit materialized correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: plan representations across success statuses'
          git push
