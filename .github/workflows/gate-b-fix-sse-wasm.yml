name: Gate B materialize portable owned SSE ABI

on:
  push:
    branches:
      - gate-b-owned-sse-stream

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-owned-sse-stream

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Apply target-portable owned stream ABI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path("src/client_generator.rs")
          text = client.read_text()

          anchor = '''impl CodeGenerator {
              /// Generate the HTTP client struct with middleware support
              pub fn generate_http_client_struct(&self) -> TokenStream {
          '''
          replacement = '''impl CodeGenerator {
              pub(crate) fn generate_http_response_stream_type_alias(
                  &self,
                  analysis: &SchemaAnalysis,
                  operations: &[&OperationInfo],
              ) -> TokenStream {
                  let has_event_stream = operations.iter().any(|operation| {
                      matches!(
                          self.get_success_response(analysis, operation).body,
                          ClientSuccessBody::EventStream
                      )
                  });
                  if !has_event_stream {
                      return quote! {};
                  }

                  quote! {
                      /// Owned byte stream returned by streaming HTTP responses.
                      #[cfg(not(target_arch = "wasm32"))]
                      pub type HttpResponseByteStream = futures_util::stream::BoxStream<
                          'static,
                          Result<bytes::Bytes, reqwest::Error>,
                      >;

                      /// Owned byte stream returned by streaming HTTP responses.
                      #[cfg(target_arch = "wasm32")]
                      pub type HttpResponseByteStream = futures_util::stream::LocalBoxStream<
                          'static,
                          Result<bytes::Bytes, reqwest::Error>,
                      >;
                  }
              }

              /// Generate the HTTP client struct with middleware support
              pub fn generate_http_client_struct(&self) -> TokenStream {
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one CodeGenerator anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement)

          old_type = '''ClientSuccessBody::EventStream => {
                          quote! { futures_util::stream::BoxStream<'static, Result<bytes::Bytes, reqwest::Error>> }
                      }'''
          new_type = '''ClientSuccessBody::EventStream => quote! { HttpResponseByteStream },'''
          if text.count(old_type) != 1:
              raise SystemExit(f"expected one SSE return type, found {text.count(old_type)}")
          text = text.replace(old_type, new_type)
          client.write_text(text)

          generator = Path("src/generator.rs")
          text = generator.read_text()
          old = '''        let error_types = self.generate_http_error_types();
                  let client_struct = self.generate_http_client_struct();
                  let operation_methods = self.generate_operation_methods_for(analysis, operations);
          '''
          new = '''        let error_types = self.generate_http_error_types();
                  let response_stream_type_alias =
                      self.generate_http_response_stream_type_alias(analysis, operations);
                  let client_struct = self.generate_http_client_struct();
                  let operation_methods = self.generate_operation_methods_for(analysis, operations);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one HTTP client assembly prelude, found {text.count(old)}")
          text = text.replace(old, new)

          old = '''            #error_types

                      #client_struct
          '''
          new = '''            #error_types

                      #response_stream_type_alias

                      #client_struct
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one HTTP client assembly insertion point, found {text.count(old)}")
          generator.write_text(text.replace(old, new))
          PY

          cat > tests/client_sse_capabilities_test.rs <<'RS'
          use openapi_to_rust::{CodeGenerator, GeneratorConfig, SchemaAnalyzer};
          use serde_json::json;
          use std::path::PathBuf;

          fn generator() -> CodeGenerator {
              CodeGenerator::new(GeneratorConfig {
                  spec_path: PathBuf::from("fixture.json"),
                  output_dir: PathBuf::from("target/sse-fixture"),
                  module_name: "fixture".to_string(),
                  enable_async_client: true,
                  ..Default::default()
              })
          }

          #[test]
          fn sse_response_uses_owned_static_stream_abi() -> Result<(), Box<dyn std::error::Error>> {
              let spec = json!({
                  "openapi": "3.1.0",
                  "info": {"title": "SSE Fixture", "version": "1.0.0"},
                  "paths": {
                      "/events": {
                          "get": {
                              "operationId": "watchEvents",
                              "responses": {
                                  "200": {
                                      "description": "Event stream",
                                      "content": {
                                          "text/event-stream": {
                                              "schema": {"type": "string"}
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              });

              let mut analyzer = SchemaAnalyzer::new(spec)?;
              let analysis = analyzer.analyze()?;
              let client = generator().generate_http_client(&analysis)?;

              assert!(
                  client.contains("pub type HttpResponseByteStream = futures_util::stream::BoxStream"),
                  "native SSE streams must retain their Send-capable owned ABI: {client}"
              );
              assert!(
                  client.contains(
                      "pub type HttpResponseByteStream = futures_util::stream::LocalBoxStream"
                  ),
                  "wasm SSE streams must use the owned non-Send ABI supported by reqwest: {client}"
              );
              assert!(
                  client.contains("Result<HttpResponseByteStream, HttpError>"),
                  "SSE methods must expose the stable stream alias: {client}"
              );
              assert!(
                  client.contains("Ok(Box::pin(response.bytes_stream()))"),
                  "the live response stream must be boxed into the owned ABI: {client}"
              );
              assert!(
                  !client.contains(
                      "impl futures_util::Stream<Item = Result<bytes::Bytes, reqwest::Error>>"
                  ),
                  "SSE return types must not remain opaque: {client}"
              );
              Ok(())
          }

          #[test]
          fn non_streaming_clients_do_not_emit_stream_alias() -> Result<(), Box<dyn std::error::Error>> {
              let spec = json!({
                  "openapi": "3.1.0",
                  "info": {"title": "JSON Fixture", "version": "1.0.0"},
                  "paths": {
                      "/value": {
                          "get": {
                              "operationId": "getValue",
                              "responses": {
                                  "200": {
                                      "description": "JSON response",
                                      "content": {
                                          "application/json": {
                                              "schema": {"type": "string"}
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              });

              let mut analyzer = SchemaAnalyzer::new(spec)?;
              let analysis = analyzer.analyze()?;
              let client = generator().generate_http_client(&analysis)?;

              assert!(!client.contains("HttpResponseByteStream"));
              Ok(())
          }
          RS

      - name: Format
        run: cargo fmt --all

      - name: Validate focused SSE and wasm contracts
        run: |
          cargo test --test client_sse_capabilities_test --all-features
          cargo test --test generated_wasm_client_test --all-features

      - name: Refresh generated corpus manifest
        run: scripts/corpus-manifest.sh

      - name: Commit materialized fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/gate-b-fix-sse-wasm.yml
          git add src/client_generator.rs src/generator.rs tests/client_sse_capabilities_test.rs tests/corpus-manifest.txt .github/workflows/gate-b-fix-sse-wasm.yml
          git commit -m 'fix: keep owned SSE streams portable to wasm'
          git push origin HEAD:gate-b-owned-sse-stream
