name: Gate B refresh SSE corpus manifest

on:
  push:
    branches:
      - gate-b-owned-sse-stream

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-owned-sse-stream

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Refresh generated corpus manifest
        run: scripts/corpus-manifest.sh

      - name: Commit manifest and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/gate-b-refresh-sse-manifest.yml
          git add tests/corpus-manifest.txt .github/workflows/gate-b-refresh-sse-manifest.yml
          git commit -m 'test: refresh SSE corpus manifest'
          git push origin HEAD:gate-b-owned-sse-stream
