name: Gate B multipart correction

on:
  push:
    branches:
      - gate-b-multipart-filenames
    paths:
      - .github/workflows/gate-b-pr2-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate-b-multipart-filenames
      - name: Apply correction
        run: python3 .github/gate-b-pr2-correction.py
      - name: Format and test focused fixture
        run: |
          cargo fmt --all
          cargo test --test client_multipart_capabilities_test
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate-b-pr2-correction.yml .github/gate-b-pr2-correction.py
          git add src/client_generator.rs tests/client_multipart_capabilities_test.rs
          git commit -m "fix: preserve multipart base wire semantics"
          git push origin HEAD:gate-b-multipart-filenames
