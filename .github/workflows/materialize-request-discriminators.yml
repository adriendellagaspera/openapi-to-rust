name: Materialize request discriminators
on:
  push:
    branches: [gate-b-request-discriminators]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply focused source transformation
        run: |
          python .github/materializers/request_discriminators.py
          python .github/materializers/request_discriminators_post.py
      - name: Remove one-shot materializer
        run: |
          rm -f .github/materializers/request_discriminators.py
          rm -f .github/materializers/request_discriminators_post.py
          rm -f .github/workflows/materialize-request-discriminators.yml
          rm -f .github/workflows/inspect-discriminator-seams.yml
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test client_request_discriminator_test --test client_response_call_shapes_test --test operation_builder_test --test selective_client_test
      - name: Strict clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Refresh generated corpus tripwire
        run: scripts/corpus-manifest.sh
      - name: Commit materialized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: plan request discriminators explicitly'
          git push origin HEAD:gate-b-request-discriminators
