name: Fix Overlay conformance

on:
  push:
    branches: [feat/openapi-overlay-1-1]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openapi-overlay-1-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Allow repeated actions and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/overlay.rs')
          text = path.read_text()
          text = text.replace('use std::collections::BTreeSet;\n', '')
          start = text.index('    let mut seen = BTreeSet::new();\n')
          end = text.index('    Ok(())\n', start)
          text = text[:start] + '    for (index, action) in actions.iter().enumerate() {\n        apply_action(document, action, source, index + 1)?;\n    }\n' + text[end:]
          anchor = '    #[test]\n    fn update_merges_objects_concatenates_arrays_and_replaces_primitives() {\n'
          test = '    #[test]\n    fn repeated_actions_are_applied_sequentially() {\n        let mut document = json!({"items": []});\n        let action = json!({"target": "$.items", "update": "x"});\n        apply(&mut document, overlay(json!([action.clone(), action])))\n            .expect("repeated actions are valid");\n        assert_eq!(document["items"], json!(["x", "x"]));\n    }\n\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected test anchor exactly once, got {text.count(anchor)}')
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fix-overlay-conformance.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: apply repeated Overlay actions sequentially"
          git push
