# One-shot branch materializer; removed by the job before its code commit.
name: Materialize call-shape planner

on:
  push:
    branches: [gate-b-call-shape-planner]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply focused source transformation
        run: |
          python .github/materializers/call_shape_planner.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/client_generator.rs')
          text = path.read_text()

          old_builder = '        let response_type = self.get_response_type(analysis, operation);'
          new_builder = '''        let base_success = self.get_success_response(analysis, operation);
                  let response_type_name = self.success_type_name(&base_success.representation);
                  let response_type = match syn::parse_str::<syn::Type>(&response_type_name) {
                      Ok(response_type) => quote! { #response_type },
                      Err(error) => error.to_compile_error(),
                  };'''
          assert text.count(old_builder) == 1, text.count(old_builder)
          text = text.replace(old_builder, new_builder, 1)

          old_variant = '''        let response_type: syn::Type = syn::parse_str(&call_shape.success_type)
                      .expect("planned client success type must be valid Rust");'''
          new_variant = '''        let response_type = match syn::parse_str::<syn::Type>(&call_shape.success_type) {
                      Ok(response_type) => quote! { #response_type },
                      Err(error) => error.to_compile_error(),
                  };'''
          assert text.count(old_variant) == 1, text.count(old_variant)
          text = text.replace(old_variant, new_variant, 1)

          path.write_text(text)
          PY
      - name: Remove materializer
        run: rm .github/materializers/call_shape_planner.py .github/workflows/materialize-call-shape-planner.yml
      - run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test client_response_call_shapes_test --test client_binary_stream_capabilities_test
      - name: Strict clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Refresh generated corpus tripwire
        run: scripts/corpus-manifest.sh
      - name: Commit materialized change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: plan response call shapes explicitly'
          git push
