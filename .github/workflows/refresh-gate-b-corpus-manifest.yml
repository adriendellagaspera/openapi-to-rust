name: Refresh Gate B corpus manifest
on:
  push:
    branches: [gate-b-multipart-capabilities]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-multipart-capabilities
      - name: Apply reviewed corpus manifest drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/corpus-manifest.txt")
          text = path.read_text()
          replacements = {
              "anthropic/client.rs                                      231071     6019 5e61b6d56d71c190": "anthropic/client.rs                                      231499     6025 651c99b6af25bd9c",
              "cartesia/client.rs                                       250746     6884 b0055cd12698d427": "cartesia/client.rs                                       251179     6893 31de0334ea6be09f",
              "cloudflare/client.rs                                   13273986   347587 7aab352c5f1cc4f6": "cloudflare/client.rs                                   13273995   347586 451201ad39922319",
              "gcore/client.rs                                         5111572   134940 841b98a2c23ff598": "gcore/client.rs                                         5111883   134946 a620b1954216232f",
              "langsmith/client.rs                                     2201458    57231 afa9d3fc9aadb2ab": "langsmith/client.rs                                     2203678    57280 5e6688f85aff4b0b",
              "retell/REQUIRED_DEPS.toml                                   528       13 d6f1ac00e2426e4d": "retell/REQUIRED_DEPS.toml                                   554       13 967b63dcee8131f1",
              "retell/client.rs                                         484380    12607 680baab3afcc5495": "retell/client.rs                                         484583    12610 19b74461b29627d9",
              "stripe/client.rs                                        2892965    75106 7ccd0ae049071746": "stripe/client.rs                                        2892973    75106 371c5c5dfbb4a306",
              "supabase/client.rs                                       602597    16288 dbc12101b4ae678e": "supabase/client.rs                                       602601    16288 8b1d9a298d2cf1df",
              "# specs: 56   files: 224   bytes: 313754689": "# specs: 56   files: 224   bytes: 313758331",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one manifest line, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/corpus-manifest.txt
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh corpus manifest for multipart support"
          git push origin HEAD:gate-b-multipart-capabilities
