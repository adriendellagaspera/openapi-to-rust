name: Refresh Gate B corpus manifest
on:
  push:
    branches: [gate-b-multipart-capabilities]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-multipart-capabilities
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refresh corpus manifest
        run: scripts/corpus-manifest.sh
      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/corpus-manifest.txt
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh corpus manifest for multipart support"
          git push origin HEAD:gate-b-multipart-capabilities
