name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply generic multipart filename capability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/client_generator.rs')
          text = path.read_text()
          old = "                MultipartClientFieldKind::RawBytes => quote! {\n                    form = form.part(\n                        #wire_name,\n                        reqwest::multipart::Part::bytes(value.to_vec()),\n                    );\n                },"
          new = "                MultipartClientFieldKind::RawBytes => quote! {\n                    form = form.part(\n                        #wire_name,\n                        reqwest::multipart::Part::bytes(value.to_vec()).file_name(#wire_name),\n                    );\n                },"
          if old not in text:
              raise SystemExit('multipart RawBytes generation shape changed; review required')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/client_multipart_capabilities_test.rs')
          text = test.read_text()
          old = '        client.contains("reqwest::multipart::Part::bytes(value.to_vec())"),\n        "nullable referenced binary schemas must remain binary multipart parts: {client}"'
          new = '        client.contains(\n            "reqwest::multipart::Part::bytes(value.to_vec()).file_name(\\\"file\\\")"\n        ),\n        "binary multipart parts must carry a deterministic field-local filename: {client}"'
          if old not in text:
              raise SystemExit('multipart capability assertion shape changed; review required')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Validate focused change
        run: |
          cargo fmt --all
          cargo test --test client_multipart_capabilities_test
          cargo clippy --test client_multipart_capabilities_test -- -D warnings
      - name: Commit only the product change
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml src/client_generator.rs tests/client_multipart_capabilities_test.rs
          git commit -m 'fix: attach filenames to binary multipart parts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
