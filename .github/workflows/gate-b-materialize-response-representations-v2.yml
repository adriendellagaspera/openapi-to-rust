name: Gate B materialize response representations v2

on: push

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-response-representations
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64; exec(base64.b64decode(""))'
          cargo fmt --all
          cargo test --test response_representations_test
          rm -f .github/workflows/gate-b-materialize-response-representations.yml .github/workflows/gate-b-materialize-response-representations-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: retain response transport representations'
          git push origin HEAD:gate-b-response-representations
