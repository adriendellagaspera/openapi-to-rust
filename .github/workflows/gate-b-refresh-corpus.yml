name: Gate B refresh corpus manifest

on:
  push:
    branches: [gate-b-multipart-filenames]
    paths:
      - .github/workflows/gate-b-refresh-corpus.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-multipart-filenames
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate corpus manifest from generator output
        run: scripts/corpus-manifest.sh
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/corpus-manifest.txt
          git diff --cached --exit-code && exit 0
          git commit -m "test: refresh corpus manifest"
          git push origin HEAD:gate-b-multipart-filenames
