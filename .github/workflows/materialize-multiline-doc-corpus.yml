name: Materialize multiline property docs
on:
  push:
    branches: [gate-b-multiline-property-docs]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Focused test
        run: cargo test --test property_multiline_doc_test
      - name: Strict clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Refresh corpus manifest
        run: scripts/corpus-manifest.sh
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/materialize-multiline-doc-corpus.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh multiline property doc corpus"
          git push origin HEAD:gate-b-multiline-property-docs
