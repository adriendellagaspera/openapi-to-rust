name: Gate B owned static SSE

on:
  push:
    branches: [gate-b-owned-static-sse]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-b-owned-static-sse
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/gate-b-owned-static-sse.py
      - run: cargo fmt
      - run: rm scripts/gate-b-owned-static-sse.py .github/workflows/gate-b-owned-static-sse.yml
      - name: Commit materialized change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: make generated SSE streams owned and static'
          git push origin HEAD:gate-b-owned-static-sse
